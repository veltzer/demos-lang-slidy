# Lets `uv sync` install this repo's Python build tools into .venv.

[project]
name = "demos-lang-slidy"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    # a2x, used by rsconstruct's a2x processor to render src/*.txt to PDF.
    "asciidoc",
]

[tool.uv]
# Demo/teaching repo: not an installable package.
package = false
