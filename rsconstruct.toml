# rsconstruct build configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.checker.taplo]
src_files = [".rumdl.toml", "rsconstruct.toml"]

# The Makefile rendered every src/*.txt AsciiDoc slidy source to PDF with
# "a2x -f pdf", placing results under out/src/. Same tool, same layout here.
[processor.generator.a2x]
src_dirs = ["src"]
args = ["-f", "pdf"]
output_dir = "out/src"

# a2x itself comes from pip (pyproject.toml dev group), but its PDF toolchain
# is system software: xmllint validates the intermediate DocBook against the
# docbook-xml DTD, and dblatex renders it.
[dependencies]
system = [
    "libxml2-utils",
    "docbook-xml",
    "dblatex",
]

# lint the GitHub Actions workflow files with actionlint
[processor.checker.iactionlint]
src_dirs = [".github/workflows"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.checker.rumdl]
src_files = ["README.md"]
