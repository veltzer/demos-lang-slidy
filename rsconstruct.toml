# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

[processor.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

# The Makefile rendered every src/*.txt AsciiDoc slidy source to PDF with
# "a2x -f pdf", placing results under out/src/. Same tool, same layout here.
[processor.a2x]
src_dirs = ["src"]
args = ["-f", "pdf"]
output_dir = "out/src"
